<svg xmlns="http://www.w3.org/2000/svg" width="680" height="940" viewBox="0 0 680 940" font-family="Helvetica, Arial, sans-serif">
<title>Order of operations: audio to verdict</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="940" fill="#ffffff"/>

<rect x="100" y="28" width="480" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">1 &#183; bank preparation (deterministic, once)</text>
<text x="340" y="68" text-anchor="middle" font-size="12" fill="#444441">AudioMNIST 48 kHz &#8594; resample 16 kHz &#183; peak-norm 0.5</text>
<text x="340" y="84" text-anchor="middle" font-size="12" fill="#444441">1% energy trim &#183; true lengths kept</text>
<path d="M340 92 L340 110 " fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="100" y="112" width="480" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">2 &#183; noise (per clip draw)</text>
<text x="340" y="152" text-anchor="middle" font-size="12" fill="#444441" font-style="italic">x &#8592; x + &#951;,&#160;&#951; ~ N(0, &#963;&#178;),&#160;&#963; = RMS(speech) &#183; 10^(dB/20)</text>
<text x="340" y="168" text-anchor="middle" font-size="12" fill="#444441">(0 dB primary condition, +5 dB robustness companion)</text>
<path d="M340 176 L340 194" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="100" y="196" width="480" height="66" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">3 &#183; frontend (one of three pathways &#8594; Fig. G8)</text>
<text x="340" y="236" text-anchor="middle" font-size="12" fill="#534AB7">envelope: STFT&#8594;mel&#8594;log&#8594;affine (62.5 fps) &#183; quadrature: + baseband phase</text>
<text x="340" y="252" text-anchor="middle" font-size="12" fill="#534AB7">carrier: FFT band-split 96&#8211;1,536 Hz (16 kHz) &#8594; rows [T &#215; 16]</text>
<path d="M340 262 L340 280" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="100" y="282" width="480" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">4 &#183; gain (calibrated per frontend)</text>
<text x="340" y="322" text-anchor="middle" font-size="12" fill="#444441" font-style="italic">rows &#8592; g &#183; rows</text>
<text x="340" y="338" text-anchor="middle" font-size="12" fill="#444441">validity: max&#8348; dt&#183;g&#183;|row| &lt; &#960; &#183; kick stats recorded per cell</text>
<path d="M340 346 L340 364" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="100" y="366" width="480" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">5 &#183; tonotopic broadcast</text>
<text x="340" y="406" text-anchor="middle" font-size="12" fill="#444441">band r &#8594; every oscillator of grid row r, all C channels</text>
<text x="340" y="422" text-anchor="middle" font-size="12" fill="#444441">(per-shape tonotopic mapping pre-declared)</text>
<path d="M340 430 L340 448" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="80" y="450" width="520" height="118" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">6 &#183; field integration (explicit Euler, dt = 0.1, T steps)</text>
<text x="340" y="493" text-anchor="middle" font-size="13" fill="#085041" font-style="italic">&#952;&#775;&#7522; = &#969;&#7522; + coupling&#7522;(&#952;; K) + drive&#7522; &#8722; &#955;&#183;sin &#952;&#7522;</text>
<text x="340" y="513" text-anchor="middle" font-size="12" fill="#0F6E56">coupling evaluated spectrally: K&#770; = FFT(K) under the boundary geometry&#8217;s wrap</text>
<text x="340" y="529" text-anchor="middle" font-size="12" fill="#0F6E56">(torus / cylinder / sheet / helix / cube / sphere &#8212; the shape factor lives here)</text>
<text x="340" y="549" text-anchor="middle" font-size="12" fill="#0F6E56">spectral clamp caps |K&#770;| &#183; coupling law per physics family &#183; SL adds amplitude ODE</text>
<path d="M340 568 L340 586" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="100" y="588" width="480" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">7 &#183; state trajectories</text>
<text x="340" y="628" text-anchor="middle" font-size="12" fill="#444441">(sin &#952;(t), cos &#952;(t)) for all 1,024 oscillators &#183; T frames</text>
<text x="340" y="642" text-anchor="middle" font-size="12" fill="#444441">valid-length mask carried throughout</text>

<path d="M240 648 L240 670 L200 670 L200 690" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>
<path d="M440 648 L440 670 L480 670 L480 690" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>

<rect x="60" y="692" width="280" height="158" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="200" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">8a &#183; readout (the verdict path)</text>
<text x="200" y="733" text-anchor="middle" font-size="12" fill="#534AB7">masked pooled statistics &#8594; &#934;(x):</text>
<text x="200" y="749" text-anchor="middle" font-size="12" fill="#534AB7">full-span &#183; 4-window &#183; macro &#183; parity &#183; settle</text>
<text x="200" y="769" text-anchor="middle" font-size="12" font-style="italic" fill="#3C3489">ridge probe W = (&#934;&#7488;&#934;+&#955;I)&#8315;&#185;&#934;&#7488;Y</text>
<text x="200" y="787" text-anchor="middle" font-size="12" fill="#534AB7">floor control: same ridge, field bypassed</text>
<text x="200" y="803" text-anchor="middle" font-size="12" fill="#534AB7">(step 3 output &#8594; step 8a directly)</text>
<text x="200" y="823" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">accuracy &#8594; pre-registered bars</text>

<rect x="360" y="692" width="280" height="158" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="500" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">8b &#183; instruments (mechanism path)</text>
<text x="500" y="735" text-anchor="middle" font-size="12" fill="#993C1D">drive-phase PLV: |&#10216;e^(i(&#952; &#8722; &#966;))&#10217;| over time,</text>
<text x="500" y="751" text-anchor="middle" font-size="12" fill="#993C1D">&#966; = Hilbert phase of the delivered drive</text>
<text x="500" y="771" text-anchor="middle" font-size="12" fill="#993C1D">order parameter R = |&#10216;e^(i&#952;)&#10217;| over oscillators</text>
<text x="500" y="791" text-anchor="middle" font-size="12" fill="#993C1D">entrained fraction (PLV &gt; 0.5)</text>
<text x="500" y="807" text-anchor="middle" font-size="12" fill="#993C1D">kick stats (bound verification)</text>
<text x="500" y="827" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">diagnostics &#8212; never verdicts</text>

<rect x="100" y="872" width="480" height="52" rx="4" fill="none" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="340" y="892" text-anchor="middle" font-size="12" fill="#444441">every cell records command + commit + seed &#183; accuracies &#183; instruments &#183; kick stats;</text>
<text x="340" y="910" text-anchor="middle" font-size="12" fill="#444441">bars pre-registered before launch, scored only at protocol n (2,048 / 512 clips)</text>
</svg>
