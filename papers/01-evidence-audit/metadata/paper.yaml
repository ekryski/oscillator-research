# Front matter for the built formats: the parts of a title block that are not
# also part of the paper as it reads. The manuscript stays plain readable
# Markdown, and anything a venue wants that is not written there lives here.
#
# The title and the abstract are the exceptions, and are written in the
# manuscript itself: the title as its `# ` heading, the abstract under
# `## Abstract`, so a reader who opens the Markdown sees both. publish.sh lifts
# each one out and hands it to pandoc as metadata, and removes it from the body
# copy so it renders once rather than twice.
author:
  - name: Eric Kryski
    affiliation: Independent researcher
    email: hello@erickryski.com
# date is filled in at build time from the manuscript's last commit
keywords:
  - coupled oscillators
  - Kuramoto model
  - reservoir computing
  - synchronization
  - neural architectures
  - literature survey
lang: en-GB
documentclass: article
classoption:
  - 11pt
geometry: margin=1in
colorlinks: true
linkcolor: RoyalBlue
citecolor: RoyalBlue
urlcolor: RoyalBlue
link-citations: true
reference-section-title: References
# Pandoc's longtables set paragraph rows solid; these space them out. The TMLR
# template carries the same two lines.
header-includes:
  - \renewcommand{\arraystretch}{1.35}
  - \setlength{\extrarowheight}{3pt}
