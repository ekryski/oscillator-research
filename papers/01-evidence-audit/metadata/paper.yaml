# Front matter for the built formats: the parts of a title block that are not
# also part of the paper as it reads. The manuscript stays plain readable
# Markdown, and anything a venue wants that is not written there lives here.
#
# The title and the abstract are the exceptions, and are written in the
# manuscript itself: the title as its `# ` heading, the abstract under
# `## Abstract`, so a reader who opens the Markdown sees both. publish.sh lifts
# each one out and hands it to pandoc as metadata, and removes it from the body
# copy so it renders once rather than twice.
author:
  - name: Eric Kryski
    affiliation: Independent researcher, Calgary, Alberta, Canada
    organization: Independent researcher
    city: Calgary
    state: Alberta
    country: Canada
    email: hello@erickryski.com
    orcid: 0009-0005-7751-9059
    credit: Conceptualization, Methodology, Investigation, Software, Data curation, Visualization, Writing – original draft, Writing – review & editing
# the running head, where the full title would not fit
shorttitle: Oscillator networks in machine learning
# Elsevier's highlights: three to five, at most 85 characters each including
# spaces, written for search engines rather than as a summary, and delivered
# as a file of their own (…-highlights.docx), never inside the manuscript
highlights:
  - Survey of eighteen oscillatory neural network systems for machine learning
  - Coupled oscillator, Kuramoto and reservoir models classified by what is trained
  - Sixteen of sixty-five control comparisons run; the coupling term ablated three times
  - Synchronization physics from Kuramoto to higher-order coupling, mapped to ML systems
  - Eight research directions, a shared benchmark, a control standard, new coupling laws
# declarations a journal template prints as unnumbered sections directly
# before the references; the TMLR template ignores them. The competing-interest
# sentence is Elsevier's standard one and matches the submission form's
# "no competing interests" confirmation; the author's research interest in the
# subject is disclosed in Section 1.5 of the paper, where it belongs.
competing-interests: The author declares no known competing financial interests or personal relationships that could have appeared to influence the work reported in this paper.
# acknowledgements: printed on the title-page file; omitted means "None."
funding: This research did not receive any specific grant from funding agencies in the public, commercial, or not-for-profit sectors.
data-availability: No new data were generated. The manuscript source, its bibliography and the tooling that builds and checks it are available at https://github.com/ekryski/oscillator-research.
# date is filled in at build time from the manuscript's last commit
keywords:
  - coupled oscillators
  - Kuramoto model
  - reservoir computing
  - synchronization
  - neural architectures
  - literature survey
lang: en-GB
documentclass: article
classoption:
  - 11pt
geometry: margin=1in
colorlinks: true
linkcolor: RoyalBlue
citecolor: RoyalBlue
urlcolor: RoyalBlue
link-citations: true
reference-section-title: References
# Pandoc's longtables set paragraph rows solid; these space them out. The TMLR
# template carries the same two lines.
header-includes:
  - \renewcommand{\arraystretch}{1.35}
  - \setlength{\extrarowheight}{3pt}
