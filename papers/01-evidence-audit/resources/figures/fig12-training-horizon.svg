<line x1="450.3337297197178" y1="176" x2="450.3337297197178" y2="182" stroke="#24231F" stroke-width="1.2" stroke-linecap="round"/>
<text x="450.3337297197178" y="195" text-anchor="middle" font-size="9" fill="#5F5E5A" font-weight="normal" font-style="normal">1,000</text>
<line x1="568.4449729596237" y1="176" x2="568.4449729596237" y2="182" stroke="#24231F" stroke-width="1.2" stroke-linecap="round"/>
<text x="568.4449729596237" y="195" text-anchor="middle" font-size="9" fill="#5F5E5A" font-weight="normal" font-style="normal">10,000</text>
<text x="350" y="214" text-anchor="middle" font-size="9.4" fill="#5F5E5A" font-weight="normal" font-style="normal">steps unrolled and backpropagated through (log scale)</text>
