<text x="265.32985184718916" y="127" text-anchor="start" font-size="9.6" fill="#24231F" font-weight="bold" font-style="normal">Un-0</text>
<text x="265.32985184718916" y="138" text-anchor="start" font-size="8.4" fill="#5F5E5A" font-weight="normal" font-style="normal">10–25 integration steps</text>
<line x1="244.26179618262262" y1="166" x2="244.26179618262262" y2="174" stroke="#C9C7C1" stroke-width="1" stroke-linecap="round"/>
