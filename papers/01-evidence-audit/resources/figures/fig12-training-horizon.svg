<rect x="91.0" y="59" width="10" height="10" fill="#24231F" stroke="#24231F" stroke-width="1.3"/>
<text x="107.0" y="63" text-anchor="start" font-size="9.6" fill="#24231F" font-weight="bold" font-style="normal">Kuramoto Attention · FSN</text>
<text x="107.0" y="74" text-anchor="start" font-size="8.4" fill="#5F5E5A" font-weight="normal" font-style="normal">one dynamics step per layer</text>
<line x1="96.0" y1="106" x2="96.0" y2="174" stroke="#C9C7C1" stroke-width="1" stroke-linecap="round"/>
<rect x="91.0" y="91" width="10" height="10" fill="#24231F" stroke="#24231F" stroke-width="1.3"/>
<text x="107.0" y="95" text-anchor="start" font-size="9.6" fill="#24231F" font-weight="bold" font-style="normal">Kuramoto Orientation Diffusion</text>
<text x="107.0" y="106" text-anchor="start" font-size="8.4" fill="#5F5E5A" font-weight="normal" font-style="normal">per-step score objectives</text>
<line x1="241.3298518471892" y1="138" x2="241.3298518471892" y2="174" stroke="#C9C7C1" stroke-width="1" stroke-linecap="round"/>
